name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch project
        run: |
          PROJECT="bad_query.xcodeproj/project.pbxproj"
          sed -i '' 's/objectVersion = 110;/objectVersion = 77;/g' "$PROJECT"
          sed -i '' 's/preferredProjectObjectVersion = 110;/preferredProjectObjectVersion = 77;/g' "$PROJECT"
          grep -n "objectVersion" "$PROJECT"

      - name: Build archive
        run: |
          xcodebuild clean archive \
            -project bad_query.xcodeproj \
            -scheme bad_query \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/bad_query.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AUTOMATIC_SIGNING_ALLOWED=NO

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R "$PWD/build/bad_query.xcarchive/Products/Applications/bad_query.app" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload bad_query.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: bad_query-unsigned-ipa
          path: bad_query.ipa
