name: Build unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned archive
        run: |
          xcodebuild clean archive \
            -project bad_query.xcodeproj \
            -scheme bad_query \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/bad_query.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AUTOMATIC_SIGNING_ALLOWED=NO

      - name: Package unsigned IPA
        run: |
          APP_PATH="$PWD/build/bad_query.xcarchive/Products/Applications/bad_query.app"

          test -d "$APP_PATH" || {
            echo "Không tìm thấy .app trong archive"
            find "$PWD/build/bad_query.xcarchive" -type d -name "*.app"
            exit 1
          }

          rm -rf Payload bad_query.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload bad_query.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: bad_query-unsigned-ipa
          path: bad_query.ipa
          if-no-files-found: error
